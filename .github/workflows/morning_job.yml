name: Morning Video Upload and Live Stream

on:
  schedule:
    # ⚠️ GitHub စက်ကြီး အလုပ်စလုပ်မည့် အချိန်ကို ပြောင်းရန်နေရာ (Cron Job)
    # GitHub သည် UTC အချိန်ကို သုံးသဖြင့် မြန်မာစံတော်ချိန်ထဲမှ ၆ နာရီခွဲ နှုတ်ရပါမည်။
    # လက်ရှိရေးထားသော '30 20 * * *' သည် မြန်မာစံတော်ချိန် မနက် ၃:၀၀ တိတိ ဖြစ်သည်။
    # ဥပမာ - မနက် ၄:၀၀ တွင် စေချင်ပါက '30 21 * * *' ဟု ပြင်ရပါမည်။
    - cron: '30 20 * * *' 
  workflow_dispatch: # လက်ဖြင့် အစမ်းနှိပ် Run ချင်လျှင် ရအောင် ထည့်ထားခြင်း

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
    - name: Repo ထဲမှ ကုဒ်များအား စက်ထဲသို့ ထည့်ခြင်း
      uses: actions/checkout@v3

    - name: Python နှင့် FFmpeg အား စက်ထဲတွင် အသင့်ပြင်ဆင်ခြင်း
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install Pillow google-auth-oauthlib google-api-python-client gdown

    - name: Google Drive မှ ဖိုင်များကို Secrets လင့်ခ်များသုံး၍ ဒေါင်းလုဒ်ဆွဲခြင်း
      run: |
        gdown ${{ secrets.M_VIDEO_LINK }} -O m_video.mp4
        gdown ${{ secrets.M_AUDIO_LINK }} -O m_audio.mp3
        #gdown ${{ secrets.M_THUMB_VIDEO }} -O m_video_thumb_raw.jpg
        #gdown ${{ secrets.M_THUMB_LIVE }} -O m_live_thumb_raw.jpg

    - name: Python Script ကို Run ၍ ရက်စွဲတပ်ခြင်းနှင့် ဗီဒီယိုအား Schedule တင်ခြင်း
      env:
        YOUTUBE_CLIENT_SECRETS_DATA: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
        YOUTUBE_TOKEN_DATA: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      run: python automation.py morning

    - #name: Live Thumbnail ဗီဒီယိုအတိုအား ရက်စွဲ အမြန်ကြိုထည့်ခြင်း (၃ စက္ကန့်သာ ကြာမည်)
      #run: |
        #ffmpeg -i m_live_thumb_raw.jpg -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='$(date +%d.%m.%Y)':x=(w-tw)/2+200:y=h-th-100:fontcolor=white:fontsize=90:box=1:boxcolor=black@0.6" -y m_live_video_ready.mp4

    - #name: YouTube ပေါ်သို့ ၅ နာရီ ၅၀ မိနစ်စာ (စက္ကန့် ၂၁၀၀၀) Live စတင်လွှင့်ခြင်း
      #run: |
        #ffmpeg -stream_loop -1 -i m_live_video_ready.mp4 -i m_audio.mp3 -c:v libx264 -pix_fmt yuv420p -preset veryfast -b:v 2500k -c:a aac -b:a 128k -f flv -t 21000 "rtmp://a.rtmp.youtube.com/live2/${{ secrets.YOUTUBE_STREAM_KEY }}"
